services:
  rabbit1:
    image: rabbitmq:4-management
    hostname: rabbit1
    container_name: rabbit1
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit1
      RABBITMQ_ERLANG_COOKIE: my-secret-cookie
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab123
    ports:
      - "5672:5672"
      - "15672:15672"
  rabbit2:
    image: rabbitmq:4-management
    hostname: rabbit2
    container_name: rabbit2
    environment:
      RABBITMQ_NODENAME: rabbit@rabbit2
      RABBITMQ_ERLANG_COOKIE: my-secret-cookie
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab123
    ports:
      - "5673:5672"
      - "15673:15672"
  
  rabbit3:
    image: rabbitmq:4-management
    hostname: rabbit3
