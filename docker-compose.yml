      RABBITMQ_NODENAME: rabbit@rabbit3
      RABBITMQ_ERLANG_COOKIE: my-secret-cookie
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab123
    ports:
      - "5674:5672"
      - "15674:15672"